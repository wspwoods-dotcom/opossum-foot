<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141810">
<title>Bluebird Box Tracker — Spring Lake Park</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --bg:#141810; --bg2:#1d2418; --panel:#232b1c; --sheet:#262e1f;
  --ink:#f2ead8; --muted:#b3a98f; --faint:#7d7663;
  --accent:#d19a2f; --accent-ink:#1a1408;
  --green:#7fa650; --blue:#5b8dd9; --red:#d05245;
  --line:#3a4330; --radius:12px; --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
#map{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1}
.topbar{position:absolute;top:0;left:0;right:0;z-index:10;background:rgba(20,24,16,.92);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:1.15em;color:var(--ink)}
.topbar p{margin:2px 0 0;font-size:.8em;color:var(--muted)}
.fab{position:absolute;z-index:10;bottom:calc(24px + env(safe-area-inset-bottom));right:16px;
  width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  border:none;font-size:28px;font-weight:bold;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer}
.fab2{position:absolute;z-index:10;bottom:calc(24px + env(safe-area-inset-bottom));left:16px;
  height:60px;padding:0 20px;border-radius:30px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);font-size:.9em;cursor:pointer}
.sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;max-height:82%;background:var(--sheet);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);transform:translateY(105%);
  transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sheet-head{padding:16px 20px 8px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0 0 4px;font-size:1.2em}
.sheet-head .sub{color:var(--muted);font-size:.85em}
.sheet-body{overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px}
.btn{flex:1;min-height:var(--tap);border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:1em;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:600}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
label{display:block;margin:14px 0 6px;color:var(--muted);font-size:.9em}
input,select,textarea{width:100%;min-height:var(--tap);background:var(--bg2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-size:1em;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}
.row>div{flex:1}
.visit{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin:10px 0}
.visit .vhead{font-weight:600;margin-bottom:4px}
.visit .vmeta{color:var(--muted);font-size:.85em}
.visit .vnotes{margin-top:6px;font-size:.9em}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.75em;font-weight:600;margin-left:8px}
.badge.proposed{background:#3a3b3c;color:var(--muted)}
.badge.placed{background:var(--blue);color:#fff}
.badge.active{background:var(--green);color:#0f1a0a}
.hint{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(20,24,16,.9);padding:12px 20px;border-radius:var(--radius);
  border:1px solid var(--accent);display:none;text-align:center;font-size:.9em}
.hint.show{display:block}
.stats{position:absolute;z-index:10;bottom:calc(100px + env(safe-area-inset-bottom));left:16px;
  background:rgba(20,24,16,.85);padding:8px 14px;border-radius:20px;font-size:.8em;color:var(--muted);
  border:1px solid var(--line)}
.statusbar{position:absolute;z-index:10;top:calc(76px + env(safe-area-inset-top));left:0;right:0;
  display:flex;gap:8px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:40px;padding:8px 16px;border-radius:20px;border:2px solid var(--line);
  background:rgba(20,24,16,.9);color:var(--muted);font-size:.85em;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{color:var(--ink);border-color:var(--accent)}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.chip[data-s="proposed"] .dot{background:#8a8a8a}
.chip[data-s="placed"] .dot{background:var(--blue)}
.chip[data-s="active"] .dot{background:var(--green)}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <h1><svg width="22" height="27" viewBox="0 0 34 42" style="vertical-align:-4px" xmlns="http://www.w3.org/2000/svg"><polygon points="17,1 32,11 2,11" fill="#d19a2f"/><rect x="5" y="11" width="24" height="21" rx="2" fill="#7fa650" stroke="#f2ead8" stroke-width="2"/><circle cx="17" cy="20" r="5" fill="#141810"/><rect x="14" y="32" width="6" height="9" fill="#6b5426"/></svg> Bluebird Box Tracker</h1>
  <p>Spring Lake Park · Greene County, Iowa</p>
</div>
<div class="hint" id="hint">Tap the map to place the box</div>
<div class="statusbar" id="statusbar">
  <button class="chip on" data-s="all">All</button>
  <button class="chip" data-s="proposed"><span class="dot"></span>Proposed</button>
  <button class="chip" data-s="placed"><span class="dot"></span>Placed</button>
  <button class="chip" data-s="active"><span class="dot"></span>Active</button>
</div>
<div class="stats" id="stats"></div>
<button class="fab" id="btn-add" title="Add box">+</button>
<button class="fab2" id="btn-export">⤓ Export</button>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2 id="sheet-title">Box</h2>
    <div class="sub" id="sheet-sub"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div>

<script src="lib/leaflet.js"></script>
<script>
// --- Data ---
const KEY = 'bluebird-boxes-v1';
let boxes = JSON.parse(localStorage.getItem(KEY) || '[]');
let selectedId = null;
let statusFilter = 'all';

document.getElementById('statusbar').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  statusFilter = chip.dataset.s;
  document.querySelectorAll('#statusbar .chip').forEach(c=>c.classList.toggle('on', c===chip));
  renderPins();
});

function save(){ localStorage.setItem(KEY, JSON.stringify(boxes)); updateStats(); }
function uid(){ return 'box-' + Date.now().toString(36) + Math.floor(Math.random()*999); }

// --- Map ---
const map = L.map('map', {zoomControl:false}).setView([42.066, -94.290], 14);
L.control.zoom({position:'topright'}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution:'Esri', maxZoom:19
}).addTo(map);
const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap', maxZoom:19
});
// Fallback to street map if satellite fails
sat.on('tileerror', ()=>{ if(!map.hasLayer(street)){ map.removeLayer(sat); street.addTo(map); } });

const markers = {};
function pinColor(status){
  return status==='active' ? '#7fa650' : status==='placed' ? '#5b8dd9' : '#8a8a8a';
}
function birdhouseSVG(color){
  return `<svg width="34" height="42" viewBox="0 0 34 42" xmlns="http://www.w3.org/2000/svg">`
    + `<polygon points="17,1 32,11 2,11" fill="#d19a2f" stroke="#f2ead8" stroke-width="1.5"/>`
    + `<rect x="5" y="11" width="24" height="21" rx="2" fill="${color}" stroke="#f2ead8" stroke-width="2"/>`
    + `<circle cx="17" cy="20" r="5" fill="#141810"/>`
    + `<rect x="14.5" y="26.5" width="5" height="3.5" rx="1" fill="#d19a2f"/>`
    + `<rect x="14" y="32" width="6" height="9" fill="#6b5426"/>`
    + `</svg>`;
}
function renderPins(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  boxes.filter(b=>statusFilter==='all'||b.status===statusFilter).forEach(b=>{
    const icon = L.divIcon({
      className:'', html:`<div style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))">${birdhouseSVG(pinColor(b.status))}</div>`,
      iconSize:[34,42], iconAnchor:[17,40]
    });
    const m = L.marker([b.lat, b.lng], {icon, draggable:true}).addTo(map);
    const iconEl = m.getElement();
    // One-finger pin drag: lock the map the moment a finger lands on a pin,
    // so the pin gets the drag instead of the map panning underneath.
    m.on('dragstart', ()=>{
      map.dragging.disable();
      if(iconEl) iconEl.style.transform += ' translateY(-48px)';
    });
    m.on('dragend', ()=>{
      map.dragging.enable();
      if(iconEl) iconEl.style.transform = iconEl.style.transform.replace(' translateY(-48px)','');
      const oldLat = b.lat.toFixed(5), oldLng = b.lng.toFixed(5);
      b.lat = m.getLatLng().lat; b.lng = m.getLatLng().lng;
      // A drag = a field move: log it, flip proposed -> placed
      if(Math.abs(b.lat - parseFloat(oldLat)) > 0.00001 || Math.abs(b.lng - parseFloat(oldLng)) > 0.00001){
        if(b.status==='proposed') b.status='placed';
        if(!b.events) b.events = [];
        b.events.push({date:new Date().toISOString().slice(0,10), type:'moved',
          note:`Pin dragged from ${oldLat}, ${oldLng} to ${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}`});
      }
      save(); renderPins();
    });
    m.on('click', ()=>openBox(b.id));
    markers[b.id] = m;
  });
  updateStats();
}
function updateStats(){
  const el = document.getElementById('stats');
  const active = boxes.filter(b=>b.status==='active').length;
  el.textContent = `${boxes.length} box${boxes.length===1?'':'es'} · ${active} active`;
}

// --- Add box: tap + then tap map, drag pin to fine-tune ---
document.getElementById('btn-add').onclick = ()=>{
  closeSheet();
  const hint = document.getElementById('hint');
  hint.textContent = 'Tap the map to drop the box';
  hint.classList.add('show');
  const placeOnce = (e)=>{
    hint.classList.remove('show');
    map.off('click', placeOnce);
    const n = boxes.length + 1;
    const b = { id:uid(), name:'Box '+n, lat:e.latlng.lat, lng:e.latlng.lng,
      status:'proposed', habitat:'', visits:[],
      events:[{date:new Date().toISOString().slice(0,10), type:'proposed', note:'Location picked on map'}] };
    boxes.push(b); save(); renderPins(); openBox(b.id);
  };
  map.on('click', placeOnce);
};

// --- Sheet ---
const sheet = document.getElementById('sheet');
function openSheet(){ sheet.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); selectedId=null; }

function openBox(id, tab){
  selectedId = id;
  const b = boxes.find(x=>x.id===id);
  if(!b) return;
  if(!b.events) b.events = [];
  tab = tab || 'checks';
  document.getElementById('sheet-title').innerHTML =
    `${esc(b.name)} <span class="badge ${b.status}">${b.status}</span>`;
  document.getElementById('sheet-sub').textContent =
    `${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}`;

  let html = `
    <label>Box name</label>
    <input id="f-name" value="${esc(b.name)}">
    <label>Status</label>
    <select id="f-status">
      <option value="proposed"${b.status==='proposed'?' selected':''}>Proposed — picked in class, not yet placed</option>
      <option value="placed"${b.status==='placed'?' selected':''}>Placed — box is up, no activity yet</option>
      <option value="active"${b.status==='active'?' selected':''}>Active — birds using it</option>
    </select>
    <label>Habitat notes (what's around the box?)</label>
    <textarea id="f-habitat" placeholder="e.g. Open mowed field, scattered oaks 30 yds east, near lake trail">${esc(b.habitat)}</textarea>
    <div class="row" style="margin-top:16px">
      <button class="btn${tab==='checks'?' primary':''}" onclick="openBox(selectedId,'checks')">Nest checks</button>
      <button class="btn${tab==='history'?' primary':''}" onclick="openBox(selectedId,'history')">Box history</button>
    </div>`;

  if(tab==='checks'){
    html += `<h3 style="margin:16px 0 4px">Nest checks <span style="color:var(--faint);font-weight:normal;font-size:.8em">— science data</span></h3>`;
    if(!b.visits.length) html += `<p style="color:var(--faint)">No checks yet. Tap "+ Log check" after visiting the box.</p>`;
    [...b.visits].reverse().forEach((v)=>{
      html += `<div class="visit">
        <div class="vhead">${esc(v.date)} — ${esc(v.observer)}</div>
        <div class="vmeta">${esc(v.species)} · Eggs ${v.eggs} · Young ${v.young} · Fledged ${v.fledged}${v.invasive!=='none'?' · ⚠ '+esc(v.invasive):''}</div>
        ${v.notes?`<div class="vnotes">${esc(v.notes)}</div>`:''}
      </div>`;
    });
  } else {
    html += `<h3 style="margin:16px 0 4px">Box history <span style="color:var(--faint);font-weight:normal;font-size:.8em">— maintenance log</span></h3>`;
    if(!b.events.length) html += `<p style="color:var(--faint)">Nothing logged yet. Tap "+ Log event" to record a repair, cleaning, move, etc.</p>`;
    [...b.events].reverse().forEach((ev)=>{
      html += `<div class="visit">
        <div class="vhead">${esc(ev.date)} — ${esc(eventLabel(ev.type))}</div>
        ${ev.note?`<div class="vnotes">${esc(ev.note)}</div>`:''}
      </div>`;
    });
  }

  document.getElementById('sheet-body').innerHTML = html + `
    <button class="btn danger" style="margin-top:20px" onclick="deleteBox()">Delete this box</button>`;
  document.getElementById('sheet-foot').innerHTML = `
    <button class="btn" onclick="closeSheet()">Close</button>
    ${tab==='checks'
      ? `<button class="btn primary" onclick="openVisit()">+ Log check</button>`
      : `<button class="btn primary" onclick="openEvent()">+ Log event</button>`}`;
  openSheet();

  // Save name/status/habitat on change
  document.getElementById('f-name').onchange = e=>{ b.name=e.target.value; save(); renderPins(); };
  document.getElementById('f-status').onchange = e=>{ b.status=e.target.value; save(); renderPins(); openBox(id, tab); };
  document.getElementById('f-habitat').onchange = e=>{ b.habitat=e.target.value; save(); };
}

function eventLabel(t){
  return {installed:'Box installed', proposed:'Location proposed', moved:'Box moved',
    cleaned:'Box cleaned', repaired:'Box repaired', destroyed:'Box destroyed',
    note:'Note'}[t] || t;
}
function logEvent(boxId, type, note){
  const b = boxes.find(x=>x.id===boxId);
  if(!b) return;
  if(!b.events) b.events = [];
  b.events.push({date:new Date().toISOString().slice(0,10), type, note:note||''});
  save();
}

function openEvent(){
  const b = boxes.find(x=>x.id===selectedId);
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('sheet-title').textContent = 'Log box event — ' + b.name;
  document.getElementById('sheet-sub').textContent = 'Maintenance and activity log (separate from science data)';
  document.getElementById('sheet-body').innerHTML = `
    <label>Date</label><input type="date" id="e-date" value="${today}">
    <label>Event type</label>
    <select id="e-type">
      <option value="installed">Box installed</option>
      <option value="cleaned">Box cleaned out</option>
      <option value="repaired">Box repaired</option>
      <option value="moved">Box moved</option>
      <option value="destroyed">Box destroyed / lost</option>
      <option value="note">Note</option>
    </select>
    <label>Details</label>
    <textarea id="e-note" placeholder="What was done?"></textarea>`;
  document.getElementById('sheet-foot').innerHTML = `
    <button class="btn" onclick="openBox(selectedId,'history')">Back</button>
    <button class="btn primary" onclick="saveEvent()">Save event</button>`;
  openSheet();
}

function saveEvent(){
  const b = boxes.find(x=>x.id===selectedId);
  if(!b.events) b.events = [];
  b.events.push({
    date: document.getElementById('e-date').value,
    type: document.getElementById('e-type').value,
    note: document.getElementById('e-note').value
  });
  save(); openBox(b.id, 'history');
}

function openVisit(){
  const b = boxes.find(x=>x.id===selectedId);
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('sheet-title').textContent = 'Log nest check — ' + b.name;
  document.getElementById('sheet-sub').textContent = 'Fill in what you found at the box';
  document.getElementById('sheet-body').innerHTML = `
    <label>Date</label><input type="date" id="v-date" value="${today}">
    <label>Observer (your name or initials)</label><input id="v-observer" placeholder="e.g. Tanner">
    <label>Species in box</label>
    <select id="v-species">
      <option>Eastern bluebird</option><option>Tree swallow</option>
      <option>Chickadee</option><option>House wren</option>
      <option>House sparrow (invasive)</option><option>European starling (invasive)</option>
      <option>Empty — no nest</option><option>Unknown</option>
    </select>
    <div class="row">
      <div><label>Eggs</label><input type="number" id="v-eggs" min="0" value="0"></div>
      <div><label>Live young</label><input type="number" id="v-young" min="0" value="0"></div>
      <div><label>Fledged</label><input type="number" id="v-fledged" min="0" value="0"></div>
    </div>
    <label>Invasive competitor sign?</label>
    <select id="v-invasive">
      <option value="none">None seen</option>
      <option value="house sparrow">House sparrow nest/material</option>
      <option value="starling">Starling evidence</option>
      <option value="blowfly">Blowfly / parasites</option>
      <option value="predation">Predation (raccoon, snake, cat)</option>
    </select>
    <label>Notes</label>
    <textarea id="v-notes" placeholder="Anything else — adult behavior, box condition, etc."></textarea>`;
  document.getElementById('sheet-foot').innerHTML = `
    <button class="btn" onclick="openBox(selectedId)">Back</button>
    <button class="btn primary" onclick="saveVisit()">Save check</button>`;
  openSheet();
}

function saveVisit(){
  const b = boxes.find(x=>x.id===selectedId);
  b.visits.push({
    date: document.getElementById('v-date').value,
    observer: document.getElementById('v-observer').value || '—',
    species: document.getElementById('v-species').value,
    eggs: +document.getElementById('v-eggs').value || 0,
    young: +document.getElementById('v-young').value || 0,
    fledged: +document.getElementById('v-fledged').value || 0,
    invasive: document.getElementById('v-invasive').value,
    notes: document.getElementById('v-notes').value
  });
  if(b.status==='proposed') b.status='placed';
  if(b.visits.some(v=>v.species==='Eastern bluebird'&&(v.eggs>0||v.young>0))) b.status='active';
  save(); renderPins(); openBox(b.id);
}

function deleteBox(){
  if(!confirm('Delete this box and all its checks?')) return;
  boxes = boxes.filter(x=>x.id!==selectedId);
  save(); renderPins(); closeSheet();
}

// --- Export: two separate data subsets ---
document.getElementById('btn-export').onclick = ()=>{
  const q = s=>'"'+(s||'').replace(/"/g,'""')+'"';
  const today = new Date().toISOString().slice(0,10);

  // Subset 1: science data (nest checks)
  const sci = ['Box,Lat,Lng,Status,Habitat,Date,Observer,Species,Eggs,Young,Fledged,Invasive,Notes'];
  boxes.forEach(b=>{
    if(!b.visits.length){
      sci.push([b.name,b.lat.toFixed(5),b.lng.toFixed(5),b.status,q(b.habitat),'','','','','','','',''].join(','));
    } else b.visits.forEach(v=>{
      sci.push([b.name,b.lat.toFixed(5),b.lng.toFixed(5),b.status,q(b.habitat),
        v.date,q(v.observer),q(v.species),v.eggs,v.young,v.fledged,v.invasive,q(v.notes)].join(','));
    });
  });
  download(new Blob([sci.join('\n')],{type:'text/csv'}), `bluebird-science-${today}.csv`);

  // Subset 2: maintenance / box history
  const maint = ['Box,Lat,Lng,Status,Date,Event,Details'];
  boxes.forEach(b=>{
    (b.events||[]).forEach(ev=>{
      maint.push([b.name,b.lat.toFixed(5),b.lng.toFixed(5),b.status,ev.date,eventLabel(ev.type),q(ev.note)].join(','));
    });
  });
  setTimeout(()=>download(new Blob([maint.join('\n')],{type:'text/csv'}), `bluebird-maintenance-${today}.csv`), 500);

  // Full JSON backup
  setTimeout(()=>download(new Blob([JSON.stringify({exported:new Date().toISOString(),boxes},null,2)],{type:'application/json'}),
    'bluebird-boxes-backup.json'), 1000);
};

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

renderPins();
</script>
</body>
</html>
